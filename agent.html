<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnarchist agent lab</title>
<style>
  body { margin: 0; background: #15131c; color: #eee; font: 15px system-ui; }
  main { padding: 20px; max-width: 1200px; margin: auto; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { color: #c8c0d6; }
  button, input { font: inherit; padding: 8px 12px; margin: 3px; }
  button { cursor: pointer; }
  iframe { border: 1px solid #514660; width: 100%; height: 580px; margin-top: 12px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }
</style>
<main>
  <h1>Turnarchist agent lab</h1>
  <p>Browser simulation · diagnostic room observations · run saves and player-stat uploads disabled</p>
  <label>Seed <input id="seed" type="number" value="123" min="0" max="4294967295"></label>
  <label>Scenario <select id="scenario"><option value="standard">Standard</option><option value="forest">Forest sandbox</option><option value="cave">Cave sandbox</option></select></label>
  <button id="lighting-check">Inspect lighting</button>
  <button id="reset">Reset run</button>
  <button data-action="up">Up</button><button data-action="down">Down</button>
  <button data-action="left">Left</button><button data-action="right">Right</button>
  <button data-action="Wait">Wait</button>
  <button data-action="LadderConfirm">Descend</button><button data-action="LadderCancel">Cancel descent</button>
  <button id="observe">Observe</button><button id="perceive">Perceive</button><button id="export">Export replay</button>
  <button id="extend">Allow 1,000 more decisions</button>
  <button id="smoke">Run smoke check</button>
  <button id="inventory-smoke">Run inventory check</button>
  <div><label>Action JSON <input id="action-json" size="55" value='{"type":"UseItem","slotIndex":0}'></label><button id="submit-action">Run action</button></div>
  <div><label>Batch seeds <input id="batch-seeds" value="123,456,789"></label>
  <label>Decisions per seed <input id="batch-decisions" type="number" value="40" min="1" max="10000"></label>
  <button id="batch-run">Run baseline batch</button><button id="batch-stop">Stop batch</button><button id="batch-export">Export batch</button></div>
  <p id="status" role="status">Loading agent game…</p>
  <iframe id="game" title="Agent game" src="./play.html?agent=1"></iframe>
  <canvas id="light-map" width="640" height="480" aria-label="Diagnostic lighting map"></canvas>
  <pre id="result" aria-label="Agent result"></pre>
</main>
<script src="./agent-baseline.js?v=4"></script>
<script src="./agent-batch.js?v=3"></script>
<script src="./agent-lab.js?v=10"></script>
</html>
